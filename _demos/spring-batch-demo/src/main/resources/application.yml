spring:
  main:
    web-application-type: none
    banner-mode: off
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

logging:
  level:
    root: warn
    org.springframework.batch: info
